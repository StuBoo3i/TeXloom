name: Deploy product website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.pages.config.ts'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q .; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::Pages artifact was not indexed in time'
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
